<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribbu'sVibe - Conectando pessoas de verdade</title>
    <meta name="description" content="Tribbu'sVibe — Conectando pessoas de verdade. Rede social antialgoritmo híbrida para a Geração Z com Dark Mode Cyber-Pop, feed cronológico, termômetros de reputação, mural de scraps e comunidades em tempo real." />
    <meta property="og:title" content="Tribbu'sVibe - Conectando pessoas de verdade" />
    <meta property="og:description" content="Tribbu'sVibe — Conectando pessoas de verdade. Rede social antialgoritmo híbrida para a Geração Z com Dark Mode Cyber-Pop, feed cronológico, termômetros de reputação, mural de scraps e comunidades em tempo real." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0C10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TribbusVibe">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        /* 🎨 Paleta Oficial Cyberpunk / Synthwave */
        :root {
            --preto-profundo: #0B0C10;
            --ciano-neon: #00F0FF;
            --pink-magenta: #FF007F;
            --roxo-vibe: #8A2BE2;
            --gradient-supremo: linear-gradient(135deg, #FF007F 0%, #9400D3 50%, #00F0FF 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--preto-profundo);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.4s ease-in-out;
            perspective: 1200px;
        }

        /* CONTAINER DA SPLASH */
        .splash-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
        }

        /* PALCO CÓSMICO DA VIA LÁCTEA */
        .milky-way-stage {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 1. NEBULOSA CENTRAL (GLOW CÓSMICO DA VIA LÁCTEA) */
        .cosmic-nebula {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.28) 0%, rgba(138, 43, 226, 0.22) 40%, rgba(0, 240, 255, 0.18) 70%, transparent 85%);
            filter: blur(28px);
            animation: respirarNebulosa 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* 2. ANÉIS ORBITAIS DA VIA LÁCTEA */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .ring-1 {
            width: 350px;
            height: 140px;
            border: 1.5px dashed rgba(0, 240, 255, 0.45);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transform: rotateX(65deg) rotateY(-15deg);
            animation: orbitarViaLactea1 16s linear infinite;
        }

        .ring-2 {
            width: 370px;
            height: 155px;
            border: 1.5px dashed rgba(255, 0, 127, 0.45);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
            transform: rotateX(65deg) rotateY(25deg);
            animation: orbitarViaLactea2 22s linear infinite reverse;
        }

        /* 3. PARTÍCULAS E POEIRA ESTELAR NA ÓRBITA */
        .star-dust {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 0 10px #00F0FF, 0 0 20px #FF007F;
        }

        .dust-1 { top: 15%; left: 20%; animation: pulsarEstrela 2.1s ease-in-out infinite; }
        .dust-2 { bottom: 20%; right: 18%; animation: pulsarEstrela 1.7s ease-in-out infinite 0.6s; }
        .dust-3 { top: 28%; right: 22%; animation: pulsarEstrela 2.4s ease-in-out infinite 1.1s; width: 4px; height: 4px; }
        .dust-4 { bottom: 25%; left: 22%; animation: pulsarEstrela 1.9s ease-in-out infinite 0.3s; width: 5px; height: 5px; }

        /* 4. A LOGO EM PNG SEM FUNDO COM PULSO NEON */
        .logo-transparent {
            position: relative;
            z-index: 5;
            width: 280px;
            max-width: 85vw;
            height: auto;
            image-rendering: -webkit-optimize-contrast;
            filter: drop-shadow(0 0 22px rgba(0, 240, 255, 0.45)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.35));
            animation: pulsarLogo 3s ease-in-out infinite;
        }

        /* 5. LINHA ULTRA-FINA DE CARREGAMENTO */
        .loader-bar-base {
            position: relative;
            z-index: 6;
            width: 240px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
        }

        .loader-bar-preenchimento {
            height: 100%;
            width: 0%;
            background: var(--gradient-supremo);
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.8);
            animation: carregarProgresso 4.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* KEYFRAMES DAS ANIMAÇÕES CÓSMICAS */
        @keyframes respirarNebulosa {
            0% {
                transform: scale(0.88);
                opacity: 0.65;
            }
            100% {
                transform: scale(1.12);
                opacity: 0.95;
            }
        }

        @keyframes orbitarViaLactea1 {
            0% { transform: rotateX(65deg) rotateY(-15deg) rotateZ(0deg); }
            100% { transform: rotateX(65deg) rotateY(-15deg) rotateZ(360deg); }
        }

        @keyframes orbitarViaLactea2 {
            0% { transform: rotateX(65deg) rotateY(25deg) rotateZ(0deg); }
            100% { transform: rotateX(65deg) rotateY(25deg) rotateZ(360deg); }
        }

        @keyframes pulsarLogo {
            0%, 100% {
                transform: scale(0.97) translateY(0px);
                filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.4)) drop-shadow(0 0 30px rgba(255, 0, 127, 0.3));
            }
            50% {
                transform: scale(1.03) translateY(-4px);
                filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.65)) drop-shadow(0 0 50px rgba(255, 0, 127, 0.5));
            }
        }

        @keyframes pulsarEstrela {
            0%, 100% { transform: scale(0.7); opacity: 0.3; }
            50% { transform: scale(1.4); opacity: 1; }
        }

        @keyframes carregarProgresso {
            0% { width: 0%; }
            20% { width: 22%; }
            55% { width: 68%; }
            100% { width: 100%; }
        }

        @media (max-width: 600px) {
            .milky-way-stage { width: 310px; height: 310px; }
            .logo-transparent { width: 225px; }
            .ring-1 { width: 290px; height: 120px; }
            .ring-2 { width: 305px; height: 130px; }
            .loader-bar-base { width: 180px; }
        }
    </style>
</head>
<body>

    <div class="splash-wrapper">
        <!-- Palco Cósmico da Via Láctea - Tribbu'sVibe Oficial -->
        <div class="milky-way-stage">
            <!-- Nebulosa estelar de fundo -->
            <div class="cosmic-nebula"></div>
            
            <!-- Anéis orbitais tridimensionais da Via Láctea -->
            <div class="orbit-ring ring-1"></div>
            <div class="orbit-ring ring-2"></div>

            <!-- Poeira Cósmica Cintilante -->
            <div class="star-dust dust-1"></div>
            <div class="star-dust dust-2"></div>
            <div class="star-dust dust-3"></div>
            <div class="star-dust dust-4"></div>

            <!-- Sua Logo Oficial Adicionada Manualmente -->
            <img src="/logo.png" 
                 alt="Tribbu'sVibe Oficial" 
                 style="position: relative; z-index: 10; max-width: 320px; width: 85vw; height: auto; object-fit: contain; filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.45)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.35));">
        </div>

        <!-- Linha de Carregamento Neon Cyberpunk -->
        <div class="loader-bar-base">
            <div class="loader-bar-preenchimento"></div>
        </div>
    </div>

    <script type="module">
        import { onAuthStateChanged } from "firebase/auth";
        import { auth } from "./src/services/tribbusFirebase.js";

        // 🪐 Transição com inteligência de sessão: se já estiver logado vai para feed.html, senão login.html
        document.addEventListener("DOMContentLoaded", () => {
            let destino = 'login.html';

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    destino = 'feed.html';
                }
            });

            setTimeout(() => {
                document.body.style.opacity = "0";
                setTimeout(() => {
                    window.location.href = destino;
                }, 300);
            }, 3000);
        });
    </script>

</body>
</html>
