<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribbu'sVibe - Carregando sua órbita...</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        /* 🎨 Alinhado com a paleta oficial Cyberpunk / Synthwave */
        :root {
            --preto-profundo: #0B0C10;   /* Fundo preto azulado oficial */
            --ciano-neon: #00F0FF;
            --pink-magenta: #FF007F;
            --gradient-supremo: linear-gradient(135deg, #FF007F 0%, #9400D3 50%, #00F0FF 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--preto-profundo);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out; /* Transição de sumiço suave */
        }

        /* CONTAINER DA ANIMAÇÃO CENTRAL */
        .splash-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 24px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        /* 🪐 PALCO DE POEIRA CÓSMICA DA VIA LÁCTEA */
        .milky-way-stage {
            position: relative;
            width: 360px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        /* NEBULOSA ESTELAR DE FUNDO */
        .cosmic-nebula {
            position: absolute;
            width: 290px;
            height: 290px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 0, 127, 0.32) 0%, rgba(148, 0, 211, 0.22) 40%, rgba(0, 240, 255, 0.18) 70%, transparent 85%);
            filter: blur(28px);
            animation: respirarNebulosa 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* ANÉIS ORBITAIS COM POEIRA ESTELAR 3D */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .ring-1 {
            width: 350px;
            height: 130px;
            border: 1.5px dashed rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
            transform: rotateX(68deg) rotateY(-12deg);
            animation: orbitarGiro1 14s linear infinite;
        }

        .ring-2 {
            width: 375px;
            height: 145px;
            border: 1.5px dashed rgba(255, 0, 127, 0.5);
            box-shadow: 0 0 16px rgba(255, 0, 127, 0.35);
            transform: rotateX(65deg) rotateY(20deg);
            animation: orbitarGiro2 18s linear infinite reverse;
        }

        /* FLUXOS DE POEIRA CÓSMICA ORBITAL */
        .cosmic-dust-stream {
            position: absolute;
            width: 380px;
            height: 140px;
            border-radius: 50%;
            transform: rotateX(68deg) rotateY(-12deg);
            animation: orbitarGiro1 12s linear infinite;
            pointer-events: none;
        }

        .cosmic-dust-stream.stream-2 {
            width: 340px;
            height: 125px;
            transform: rotateX(65deg) rotateY(18deg) rotateZ(35deg);
            animation: orbitarGiro2 16s linear infinite reverse;
        }

        .dust-mote {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 8px currentColor, 0 0 14px currentColor;
            animation: cintilarPoeira 2.2s ease-in-out infinite alternate;
        }

        /* PARTICULAS INDIVIDUAIS DE POEIRA CÓSMICA CINTILANTE */
        .star-dust {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            pointer-events: none;
            box-shadow: 0 0 10px #00F0FF, 0 0 20px #FF007F;
        }

        .dust-1 { top: 12%; left: 15%; width: 5px; height: 5px; animation: pulsarEstrela 2.1s ease-in-out infinite; }
        .dust-2 { bottom: 18%; right: 14%; width: 6px; height: 6px; animation: pulsarEstrela 1.7s ease-in-out infinite 0.6s; }
        .dust-3 { top: 22%; right: 18%; width: 4px; height: 4px; animation: pulsarEstrela 2.4s ease-in-out infinite 1.1s; }
        .dust-4 { bottom: 20%; left: 18%; width: 5px; height: 5px; animation: pulsarEstrela 1.9s ease-in-out infinite 0.3s; }
        .dust-5 { top: 48%; left: 8%; width: 4px; height: 4px; animation: pulsarEstrela 2.6s ease-in-out infinite 0.8s; }
        .dust-6 { top: 45%; right: 8%; width: 5px; height: 5px; animation: pulsarEstrela 2.0s ease-in-out infinite 1.4s; }

        /* A NOSSA LOGO SUPREMA COM ANIMAÇÃO DE PULSAR E BRILHAR */
        .logo-splash {
            position: relative;
            z-index: 10;
            max-width: 320px;
            width: 85vw;
            height: auto;
            image-rendering: high-quality;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.45)) drop-shadow(0 0 35px rgba(255, 0, 127, 0.35));
            animation: pulsarLogo 3s ease-in-out infinite;
        }

        /* BARRA DE CARREGAMENTO ULTRA FINA EM DEGRADÊ NEON */
        .loader-bar-base {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .loader-bar-preenchimento {
            height: 100%;
            width: 0%;
            background: var(--gradient-supremo);
            border-radius: 10px;
            animation: carregarProgresso 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 🚀 KEYFRAMES DAS ANIMAÇÕES CÓSMICAS */
        @keyframes respirarNebulosa {
            0% { transform: scale(0.92); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 0.95; }
        }

        @keyframes orbitarGiro1 {
            0% { transform: rotateX(68deg) rotateY(-12deg) rotateZ(0deg); }
            100% { transform: rotateX(68deg) rotateY(-12deg) rotateZ(360deg); }
        }

        @keyframes orbitarGiro2 {
            0% { transform: rotateX(65deg) rotateY(20deg) rotateZ(0deg); }
            100% { transform: rotateX(65deg) rotateY(20deg) rotateZ(360deg); }
        }

        @keyframes cintilarPoeira {
            0% { transform: scale(0.6); opacity: 0.3; }
            50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 6px currentColor); }
            100% { transform: scale(0.75); opacity: 0.45; }
        }

        @keyframes pulsarEstrela {
            0%, 100% { transform: scale(0.7); opacity: 0.4; }
            50% { transform: scale(1.4); opacity: 1; filter: drop-shadow(0 0 8px #00F0FF); }
        }

        @keyframes pulsarLogo {
            0%, 100% {
                transform: scale(0.97);
                filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.35)) drop-shadow(0 0 25px rgba(255, 0, 127, 0.25));
            }
            50% {
                transform: scale(1.02);
                filter: drop-shadow(0 0 35px rgba(0, 240, 255, 0.55)) drop-shadow(0 0 40px rgba(255, 0, 127, 0.45));
            }
        }

        @keyframes carregarProgresso {
            0% { width: 0%; }
            20% { width: 15%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }

        @media (max-width: 600px) {
            .milky-way-stage { width: 300px; height: 240px; }
            .ring-1 { width: 280px; height: 110px; }
            .ring-2 { width: 295px; height: 120px; }
            .cosmic-dust-stream { width: 290px; height: 115px; }
            .logo-splash { max-width: 250px; }
            .loader-bar-base { width: 160px; }
        }
    </style>
</head>
<body>

    <div class="splash-container">
        <!-- 🪐 Palco Cósmico da Via Láctea com Poeira Estelar -->
        <div class="milky-way-stage">
            <!-- Nebulosa estelar de fundo -->
            <div class="cosmic-nebula"></div>
            
            <!-- Anéis orbitais tridimensionais -->
            <div class="orbit-ring ring-1"></div>
            <div class="orbit-ring ring-2"></div>

            <!-- Fluxo 1 de poeira cósmica em órbita -->
            <div class="cosmic-dust-stream">
                <span class="dust-mote" style="width: 7px; height: 7px; color: #00F0FF; background: #00F0FF; top: 2px; left: 35px; animation-delay: 0.2s;"></span>
                <span class="dust-mote" style="width: 6px; height: 6px; color: #FF007F; background: #FF007F; bottom: 4px; left: 55px; animation-delay: 0.8s;"></span>
                <span class="dust-mote" style="width: 8px; height: 8px; color: #FFD700; background: #FFD700; top: 6px; right: 45px; animation-delay: 1.4s;"></span>
                <span class="dust-mote" style="width: 5px; height: 5px; color: #00FF7F; background: #00FF7F; bottom: 3px; right: 65px; animation-delay: 0.5s;"></span>
            </div>

            <!-- Fluxo 2 de poeira cósmica em órbita reversa -->
            <div class="cosmic-dust-stream stream-2">
                <span class="dust-mote" style="width: 6px; height: 6px; color: #8A2BE2; background: #8A2BE2; top: 5px; left: 60px; animation-delay: 0.4s;"></span>
                <span class="dust-mote" style="width: 7px; height: 7px; color: #00F0FF; background: #00F0FF; bottom: 3px; left: 80px; animation-delay: 1.1s;"></span>
                <span class="dust-mote" style="width: 6px; height: 6px; color: #FF007F; background: #FF007F; top: 4px; right: 55px; animation-delay: 1.8s;"></span>
            </div>

            <!-- Partículas estelares cintilantes -->
            <div class="star-dust dust-1"></div>
            <div class="star-dust dust-2"></div>
            <div class="star-dust dust-3"></div>
            <div class="star-dust dust-4"></div>
            <div class="star-dust dust-5"></div>
            <div class="star-dust dust-6"></div>

            <!-- Logo Oficial do Tribbu'sVibe no centro orbital -->
            <img class="logo-splash" src="/logo.png" alt="Tribbu'sVibe Oficial">
        </div>
        
        <!-- Linha discreta de carregamento cyberpunk -->
        <div class="loader-bar-base">
            <div class="loader-bar-preenchimento"></div>
        </div>
    </div>

    <script>
        // 🪐 Lógica de Transição da Splash Screen
        document.addEventListener("DOMContentLoaded", () => {
            // Aguarda 3 segundos (tempo perfeito da animação) antes de mudar de tela
            setTimeout(() => {
                // Aplica o efeito de sumiço (fade-out) no corpo da página
                document.body.style.opacity = "0";
                
                // Aguarda o término do efeito visual para redirecionar de verdade
                setTimeout(() => {
                    window.location.href = "login.html"; // Joga direto na tela de acesso escura
                }, 800);
                
            }, 3000);
        });
    </script>

</body>
</html>
