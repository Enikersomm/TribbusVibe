<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundar Minha Tribu - Tribbu'sVibe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --preto-profundo: #0B0C10;
            --cinza-card: #121214;
            --cinza-input: #18181b;
            --ciano-neon: #00F0FF;
            --pink-magenta: #FF007F;
            --branco: #FFFFFF;
            --texto-suave: #9AA0A6;
            --gradient-supremo: linear-gradient(135deg, #FF007F 0%, #9400D3 50%, #00F0FF 100%);
        }

        body {
            background-color: var(--preto-profundo);
            color: var(--branco);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container-criar {
            background: var(--cinza-card);
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin: 40px auto;
            box-sizing: border-box;
        }

        .input-grupo {
            margin-bottom: 20px;
        }

        .input-grupo label {
            font-size: 0.85rem;
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: var(--branco);
        }

        .input-style {
            background: var(--cinza-input);
            color: #FFF;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            border-radius: 12px;
            width: 100%;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-style:focus {
            border-color: var(--ciano-neon);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        .btn-base {
            padding: 14px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
        }

        .btn-base:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- 🪐 NAVBAR SUPREMA COM SCROLL HORIZONTAL DESLIZANTE -->
    <header class="navbar" style="background-color: var(--cinza-card); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid transparent; border-image: var(--gradient-supremo) 1; position: sticky; top: 0; z-index: 100; min-height: 55px; flex-wrap: wrap; gap: 10px;">
        <div class="nav-logo-container">
            <a href="feed.html">
                <img src="img/image_1gVwMG.png" style="height: 40px; width: auto; filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.25));" onerror="this.src='img/image_p_Y_em.png'" alt="Tribbu'sVibe Logo">
            </a>
        </div>
        <div class="nav-scroll-central" style="display: flex; align-items: center; gap: 15px; overflow-x: auto; max-width: 100%; padding: 5px 0; scrollbar-width: none; -webkit-overflow-scrolling: touch;">
            <nav class="nav-links" style="display: flex; gap: 18px; align-items: center;">
                <a href="feed.html" style="text-decoration: none; color: var(--texto-suave); font-weight: 600; font-size: 0.88rem; white-space: nowrap;">Feed</a>
                <a href="tribos.html" style="text-decoration: none; color: var(--texto-suave); font-weight: 600; font-size: 0.88rem; white-space: nowrap;">Tribos</a>
                <a href="chat.html" style="text-decoration: none; color: var(--texto-suave); font-weight: 600; font-size: 0.88rem; white-space: nowrap;">Messenger</a>
                <a href="perfil.html" style="text-decoration: none; color: var(--texto-suave); font-weight: 600; font-size: 0.88rem; white-space: nowrap;">Meu Perfil</a>
                <a href="configuracoes.html" style="text-decoration: none; color: var(--texto-suave); font-weight: 600; font-size: 0.88rem; white-space: nowrap;">Configurações</a>
                <a href="index.html" style="text-decoration: none; color: var(--pink-magenta); font-weight: bold; font-size: 0.88rem; white-space: nowrap;">Sair</a>
            </nav>
        </div>
    </header>

    <!-- 📝 FORMULÁRIO CENTRAL DE CADASTRO DA TRIBBU -->
    <div class="container-criar">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="margin: 0 0 5px 0; font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px;">Fundar Sua Tribu</h2>
            <p style="font-size: 0.8rem; color: var(--texto-suave); font-style: italic; margin: 0;">Crie o seu bando original focado em interesses reais! 🪐</p>
        </div>

        <form id="form-cadastro-tribu">
            <!-- Nome da Tribbu -->
            <div class="input-grupo">
                <label for="input-nome-tribu">📛 Nome da Tribu</label>
                <input type="text" id="input-nome-tribu" class="input-style" required placeholder="Ex: Desenvolvedores Indie de Games">
            </div>

            <!-- Manifesto / Descrição -->
            <div class="input-grupo">
                <label for="txt-descricao-tribu">📜 Manifesto / Descrição da Vibe</label>
                <textarea id="txt-descricao-tribu" class="input-style" rows="4" required placeholder="Escreva as regras, objetivos e o que rola no bando..." style="resize: none;"></textarea>
            </div>

            <!-- Upload da Foto de Capa Oficial -->
            <div class="input-grupo" style="margin-bottom: 30px;">
                <label for="file-capa-tribu">📸 Foto de Capa da Comunidade</label>
                <input type="file" id="file-capa-tribu" accept="image/*" class="input-style" required style="padding: 8px;">
            </div>

            <!-- Botões Horizontais de Decisão -->
            <div style="display: flex; gap: 15px;">
                <button type="button" onclick="window.location.href='tribos.html'" class="btn-base" style="flex: 1; background: var(--cinza-input); color: #FFF; border: 1px solid rgba(255,255,255,0.05);">Cancelar</button>
                <button type="submit" id="btn-lancar-tribu" class="btn-base" style="flex: 2; background: var(--gradient-supremo); color: #FFF; box-shadow: 0 4px 15px rgba(255,0,127,0.35);">Lançar no Universo</button>
            </div>
        </form>
    </div>

    <!-- 📡 ENCANAMENTO JAVASCRIPT EM TEMPO REAL INTEGRADO COM O FIRESTORE E STORAGE -->
    <script type="module">
        import { auth, db, storage } from "./src/services/tribbusFirebase.js";
        import { collection, addDoc } from "firebase/firestore";
        import { ref, uploadBytes, getDownloadURL } from "firebase/storage";

        const form = document.getElementById("form-cadastro-tribu");
        const btnLancar = document.getElementById("btn-lancar-tribu");

        // 🛡️ SEGURANÇA MÁXIMA: Protege a órbita contra usuários deslogados apenas após verificação completa
        let authPronto = false;
        auth.onAuthStateChanged((user) => {
            authPronto = true;
            if (!user) {
                // Dá um pequeno tempo antes de redirecionar para não cortar na transição
                setTimeout(() => {
                    if (!auth.currentUser) {
                        console.warn("[CriarTribu] Sem usuário logado, redirecionando para login.");
                        window.location.href = "login.html";
                    }
                }, 800);
            }
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const meuUID = auth?.currentUser?.uid;
            const meuNome = auth?.currentUser?.displayName || "Fundador Solitário";

            if (!meuUID) {
                alert("⚠️ Por favor, faça login para fundar a sua Tribu.");
                window.location.href = "login.html";
                return;
            }

            // Trava o botão para evitar cliques duplos que gastam cota do Firebase
            btnLancar.disabled = true;
            btnLancar.innerText = "⏳ Fundando bando no universo...";

            try {
                const nomeTribu = document.getElementById("input-nome-tribu").value.trim();
                const descricaoTribu = document.getElementById("txt-descricao-tribu").value.trim();
                const arquivoInput = document.getElementById("file-capa-tribu");

                if (!arquivoInput.files || arquivoInput.files.length === 0) {
                    alert("⚠️ Escolha uma foto de capa pesada para caracterizar sua Tribu!");
                    btnLancar.disabled = false;
                    btnLancar.innerText = "Lançar no Universo";
                    return;
                }

                const arquivo = arquivoInput.files[0];

                console.log("Subindo imagem de capa da comunidade para as nuvens do Google...");
                // 1. Upload do arquivo real no Storage com carimbo de tempo único
                const timestampUnico = Date.now();
                const capaRef = ref(storage, `capas_tribos/tribu_${timestampUnico}_${meuUID}.png`);
                await uploadBytes(capaRef, arquivo);
                const capaUrlFinal = await getDownloadURL(capaRef);

                console.log("Gravando documento na coleção de tribos do Firestore...");
                // 2. Grava o documento completo unificado com o UID real do criador
                await addDoc(collection(db, "tribos"), {
                    nome: nomeTribu,
                    descricao: descricaoTribu,
                    capa_url: capaUrlFinal,
                    criador_uid: meuUID,
                    criador_nome: meuNome,
                    membros_contador: 1,
                    data_criacao: new Date().toISOString()
                });

                alert("🎉 Vitória! Sua Tribu foi fundada com sucesso na rede!");
                window.location.href = "tribos.html";

            } catch (err) {
                console.error("Erro ao fundar Tribu:", err);
                alert("⚠️ Erro ao lançar bando no Firebase. Verifique sua conexão e tente novamente.");
                btnLancar.disabled = false;
                btnLancar.innerText = "Lançar no Universo";
            }
        };
    </script>
</body>
</html>
