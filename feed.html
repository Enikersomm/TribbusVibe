<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribbu'sVibe - Feed</title>
    <meta name="theme-color" content="#0B0C10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TribbusVibe">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --preto-profundo: #0B0C10;   
            --cinza-card: #121214;       
            --cinza-input: #1E1E24;      
            --branco: #FFFFFF;
            --texto-suave: #9AA0A6;
            --ciano-neon: #00F0FF;
            --pink-magenta: #FF007F;
            --gradient-supremo: linear-gradient(135deg, #FF007F 0%, #9400D3 50%, #00F0FF 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--preto-profundo);
            color: var(--branco);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .navbar {
            width: 100%;
            background-color: var(--cinza-card);
            padding: 10px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid transparent;
            border-image: var(--gradient-supremo) 1;
            position: sticky; top: 0; z-index: 100;
        }

        .nav-logo-img { height: 45px; width: auto; }
        .nav-links { display: flex; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--texto-suave); margin-right: 20px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--pink-magenta); }

        @media (max-width: 768px) {
            .navbar {
                padding: 10px 15px;
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
            .nav-logo-container {
                justify-content: center;
            }
            .nav-links {
                display: flex;
                width: 100%;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                gap: 8px;
                padding-bottom: 4px;
                justify-content: flex-start;
            }
            .nav-links::-webkit-scrollbar {
                display: none;
            }
            .nav-links a {
                margin-right: 0;
                padding: 6px 14px;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 50px;
                font-size: 0.85rem;
                flex-shrink: 0;
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
            .nav-links a.active {
                background: rgba(255, 0, 127, 0.15);
                border-color: var(--pink-magenta);
            }
        }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            max-width: 1200px;
            width: 100%;
            gap: 20px;
            margin-top: 20px;
            padding: 0 20px;
        }

        .card-vibe {
            background: var(--cinza-card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* PALHETA DE STORIES COLETIVOS (TOP) */
        .stories-container {
            grid-column: 1 / -1;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .circle-story { width: 60px; height: 60px; border-radius: 50%; border: 2px dashed var(--ciano-neon); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; background: var(--cinza-input); cursor: pointer; }

        /* PERFIL LATERAL REAIS */
        .perfil-avatar { width: 90px; height: 90px; background: var(--cinza-input); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; border: 2px solid var(--ciano-neon); }
        .termometros-mini { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; font-size: 0.8rem; color: var(--texto-suave); }
        .barra-mini { width: 100%; height: 6px; background: var(--cinza-input); border-radius: 10px; overflow: hidden; margin-top: 2px; }
        .barra-preenchida { height: 100%; background: var(--gradient-supremo); width: 0%; transition: width 0.5s ease; }

        /* CAIXA DE POSTAGEM */
        .card-postar textarea { width: 100%; height: 70px; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; resize: none; background: var(--cinza-input); color: var(--branco); }
        .card-postar textarea:focus { outline: none; border-color: var(--ciano-neon); }
        .postar-acoes { display: flex; justify-content: space-between; align-items: center; }
        
        .btn-primario { background: var(--gradient-supremo); color: var(--branco); border: none; padding: 8px 24px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        .btn-primario:hover { background: var(--gradient-hover); }

        /* LISTA DO FEED CRONOLÓGICO */
        .feed-lista { display: flex; flex-direction: column; gap: 20px; }
        .card-feed { background: var(--cinza-card); border: 1px solid rgba(255, 255, 255, 0.03); }
        .usuario-info { display: flex; gap: 10px; align-items: center; }
        .avatar-m { width: 40px; height: 40px; border-radius: 50%; background: var(--cinza-input); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }
        .feed-conteudo p { font-size: 0.95rem; line-height: 1.5; color: var(--branco); margin: 12px 0; }
        .feed-footer { display: flex; gap: 15px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 10px; }
        .acao-feed { background: none; border: none; color: var(--texto-suave); cursor: pointer; display: flex; align-items: center; gap: 6px; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } .coluna-lateral { display: none; } }
    </style>
</head>
<body>

    <!-- NAVBAR LIMPA E PROFISSIONAL -->
    <header class="navbar">
        <a href="feed.html" class="nav-logo-container" title="Tribbu'sVibe" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <img src="/logo.png" alt="Tribbu'sVibe" style="height: 38px; width: auto; max-width: 180px; object-fit: contain;">
        </a>
        <nav class="nav-links">
            <a href="feed.html" class="active">Feed</a>
            <a href="tribos.html">Tribos</a>
            <a href="perfil.html?tab=chat">Messenger</a>
            <a href="perfil.html">Meu Perfil</a>
            <a href="configuracoes.html">Configurações</a>
            <a href="login.html" class="btn-logout-global" style="color: var(--pink-magenta); cursor: pointer;"><i class="fas fa-sign-out-alt"></i> Sair</a>
        </nav>
    </header>

    <div class="main-layout">
        
        <!-- 🪐 COMPONENTE ATUALIZADO: MURAL DE VIBES FLEXÍVEL (STORIES DAS TRIBOS) -->
        <div class="mural-vibes-secao" style="grid-column: 1 / -1; background: var(--cinza-card); padding: 20px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.03); margin-bottom: 10px;">
            
            <!-- 1. BARRA HORIZONTAL DE BOLINHAS DINÂMICAS -->
            <div class="stories-container" id="container-stories-realtime" style="display: flex; gap: 18px; overflow-x: auto; padding-bottom: 6px; align-items: center;">
                
                <!-- Botão Principal de Adicionar (Abre o modal de fotos, vídeos, músicas e texto) -->
                <div class="circle-story btn-abrir-seletor" title="Compartilhar uma Vibe de 24h (Foto, Música, Vídeo ou Texto)" style="width: 65px; height: 65px; border-radius: 50%; border: 2px dashed var(--ciano-neon); display: flex; justify-content: center; align-items: center; font-size: 1.6rem; background: var(--cinza-input); cursor: pointer; color: var(--ciano-neon); transition: transform 0.2s; filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.2)); flex-shrink: 0;">
                    <i class="fas fa-plus"></i>
                </div>

                <!-- O JavaScript do Firebase vai limpar e injetar as bolinhas reais dos usuários aqui -->
                <span id="txt-sem-vibes" style="font-size: 0.85rem; color: var(--texto-suave); font-style: italic; margin-left: 10px;">Nenhuma vibe na comu hoje...</span>
            </div>
        </div>

        <!-- COLUNA ESQUERDA: APENAS DADOS DO USUÁRIO QUE LOGAR (Sem nomes fakes fixos) -->
        <aside class="coluna-lateral">
            <div class="card-vibe" style="align-items: center; text-align: center;">
                <!-- O JavaScript vai injetar o emoji e o nome real vindo do login -->
                <div class="perfil-avatar" id="lbl-avatar-logado">👤</div>
                <h2 id="lbl-nome-logado" style="font-size: 1.1rem; margin-top: 5px;">Carregando...</h2>
                <p id="lbl-status-logado" style="font-size: 0.8rem; color: var(--texto-suave); font-style: italic;"></p>
                
                <div class="termometros-mini">
                    <div>🧊 Confiável <div class="barra-mini"><div class="barra-preenchida id-barra-confiavel"></div></div></div>
                    <div>❤️ Legal <div class="barra-mini"><div class="barra-preenchida id-barra-legal"></div></div></div>
                    <div>🌟 Vibe <div class="barra-mini"><div class="barra-preenchida id-barra-vibe"></div></div></div>
                </div>
            </div>
        </aside>

        <!-- COLUNA CENTRAL: O FEED CRONOLÓGICO REAL -->
        <main style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card-vibe card-postar">
                <textarea placeholder="Qual é o seu micro-vibe de hoje? ✨" id="input-vibe"></textarea>
                <div class="postar-acoes">
                    <button class="btn-primario" id="btn-postar">Postar</button>
                </div>
            </div>

            <!-- O JavaScript limpa este container e puxa as postagens do banco reais -->
            <div class="feed-lista" id="feed-dinamico-container">
                <p style="text-align: center; color: var(--texto-suave); font-size: 0.9rem; margin-top: 20px;">Nenhum micro-vibe compartilhado ainda. Seja o primeiro! 🪐</p>
            </div>
        </main>

        <!-- COLUNA DIREITA: EM BRANCO PARA O FIREBASE CARREGAR ROLÊS REAIS -->
        <aside class="coluna-lateral">
            <div class="card-vibe">
                <h3><i class="fas fa-calendar-alt" style="color: var(--ciano-neon);"></i> Próximos Rolês</h3>
                <div id="lista-eventos-realtime" style="display: flex; flex-direction: column; gap: 10px;">
                    <p style="font-size: 0.8rem; color: var(--texto-suave); font-style: italic;">Nenhum rolê marcado na sua comu por enquanto.</p>
                </div>
            </div>
        </aside>

    </div>

    <!-- Encanamento Firebase em Tempo Real -->
    <script type="module" src="./src/services/app-feed-page.js"></script>
</body>
</html>
